# Style Python commun à tout le dépôt (bank-api, agent-api, scripts).
# Mettre en forme : uvx ruff format · Vérifier : uvx ruff check
line-length = 120
target-version = "py312"

[lint]
# Règles par défaut (erreurs réelles) + imports triés (I) + bugs fréquents (B) + syntaxe moderne (UP).
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.isort]
# « app » et « tests » sont notre code (bank-api, agent-api) : leurs imports forment un bloc à part.
known-first-party = ["app", "tests"]
