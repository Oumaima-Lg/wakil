[project]
name = "agent-api"
version = "0.1.0"
description = "Agent Wakil : comprend la darija et interroge la Banque Atlas Démo (données 100 % fictives)."
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.146.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "app.main:app"

# Contrats d'architecture (équivalent d'ArchUnit), vérifiés par : uv run lint-imports
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "agent-api ne parle jamais directement à bank-api : tout passe par le serveur MCP"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["httpx", "requests", "urllib3"]
