[project]
name = "portail-api"
version = "0.1.0"
description = "Portail de la Banque Atlas Démo : session et pages de l'espace bancaire, sans IA (données 100 % fictives)."
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "app.main:app"

# Contrats d'architecture (équivalent d'ArchUnit), vérifiés par : uv run lint-imports
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "portail-api n'a aucune IA : ni LLM, ni agent, ni outil MCP"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["langchain_core", "langchain_ollama", "langgraph", "mcp"]
