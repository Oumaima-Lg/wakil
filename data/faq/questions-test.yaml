# (une demande sur le compte, que le LLM doit envoyer à un outil, ou du hors-sujet). Ces dernières servent à
# choisir le seuil : leur meilleur score doit rester sous le seuil.
# outil : pour une demande sur le compte, l'outil que le LLM doit choisir (mesure du routage, evals/faq/routage.py).
# Les questions de FAQ attendent l'outil question_faq ; le hors-sujet n'attend aucun outil.

