- id: decouvert
  titre: Solde insuffisant et découvert
  texte: >-
    La Banque Atlas Démo n'autorise pas de découvert : le solde ne descend jamais sous 0 DH. Si un paiement ou un
    virement dépasse votre solde, la banque le refuse, et Wakil vous dit combien il manque avant même de demander
    votre confirmation.
  questions:
    - wach n9der nkhelles ila solde ma kafich ?
    - واش كاين الديكوفير؟
    - ila ma kanch 3endi flous kafyin chno kayw9e3 ?
    - n9der ndouz l solde f negatif ?
    - wach t9der tsle7 lia chi flous ?

- id: donnees
  titre: Données fictives et vie privée
  texte: >-
    La Banque Atlas Démo est un projet de démonstration : la banque, les clients, les comptes, les factures et les
    montants sont 100 % fictifs. Aucune donnée réelle n'est demandée, et le modèle d'IA tourne en local par défaut.
    N'écrivez jamais vos vraies informations bancaires dans le chat.
  questions:
    - wach had la banque bss7 ?
    - واش هاد البنك حقيقي؟
    - fin kaymchiw les messages dyali ?
    - wach les données dyali m7miyin ?
    - wach kat7tafdo b les informations dyali ?

- id: horaires
  titre: Horaires et agences
  texte: >-
    Wakil répond à toute heure, 7 jours sur 7. La Banque Atlas Démo n'a pas d'agence : elle n'existe que dans cette
    démonstration. Après quelques minutes sans message, la première réponse peut prendre jusqu'à 30 secondes, le temps
    que le modèle se recharge.
  questions:
    - imta kat7el la banque ?
    - wach khdamin nhar l7ed ?
    - فين كاينة الوكالة ديالكم؟
    - wach Wakil khdam f lil ?
