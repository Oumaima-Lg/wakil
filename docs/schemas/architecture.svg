<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title>Architecture de Wakil</title>
  <desc>Le navigateur parle à web (Next.js). web envoie /api/… à portail-api (pages et bac à sable, sans IA) et /api/chat à agent-api (Wakil). agent-api passe par MCP à mcp-tools, seule porte de l'IA vers la banque. portail-api et mcp-tools appellent bank-api en HTTP.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#FFFFFF"/>

  <rect x="190" y="40" width="240" height="84" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="310" y="72" text-anchor="middle" font-size="20" font-weight="600" fill="#444441">Navigateur</text>
  <text x="310" y="102" text-anchor="middle" font-size="16" fill="#5F5E5A">Visiteur ou client</text>

  <rect x="570" y="40" width="240" height="84" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="690" y="72" text-anchor="middle" font-size="20" font-weight="600" fill="#444441">web (Next.js)</text>
  <text x="690" y="102" text-anchor="middle" font-size="16" fill="#5F5E5A">Interface seulement</text>

  <rect x="100" y="220" width="370" height="104" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="285" y="262" text-anchor="middle" font-size="20" font-weight="600" fill="#085041">portail-api</text>
  <text x="285" y="296" text-anchor="middle" font-size="16" fill="#0F6E56">Session, espace, bac à sable</text>

  <rect x="505" y="220" width="370" height="104" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="690" y="262" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">agent-api (Wakil)</text>
  <text x="690" y="296" text-anchor="middle" font-size="16" fill="#534AB7">Comprend, confirme, répond</text>

  <rect x="505" y="410" width="370" height="84" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="690" y="442" text-anchor="middle" font-size="20" font-weight="600" fill="#3C3489">mcp-tools (serveur MCP)</text>
  <text x="690" y="472" text-anchor="middle" font-size="16" fill="#534AB7">Seule porte IA vers la banque</text>

  <rect x="100" y="590" width="775" height="84" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="487.5" y="622" text-anchor="middle" font-size="20" font-weight="600" fill="#444441">bank-api</text>
  <text x="487.5" y="652" text-anchor="middle" font-size="16" fill="#5F5E5A">Données et toutes les règles métier</text>

  <g fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#fleche)">
    <line x1="430" y1="82" x2="565" y2="82"/>
    <path d="M630 124 V160 H285 V214"/>
    <line x1="690" y1="124" x2="690" y2="214"/>
    <line x1="690" y1="324" x2="690" y2="404"/>
    <line x1="285" y1="324" x2="285" y2="584"/>
    <line x1="690" y1="494" x2="690" y2="584"/>
  </g>
  <g font-size="16" fill="#444441">
    <text x="297" y="196">/api/… pages</text>
    <text x="702" y="196">/api/chat</text>
    <text x="702" y="372">MCP</text>
    <text x="297" y="550">HTTP, lecture et écriture</text>
    <text x="702" y="550">HTTP</text>
  </g>

  <rect x="100" y="706" width="20" height="20" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="132" y="722" font-size="16" fill="#444441">Pages et bac à sable, sans IA</text>
  <rect x="505" y="706" width="20" height="20" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="537" y="722" font-size="16" fill="#444441">Chemin de l'IA</text>
</svg>
