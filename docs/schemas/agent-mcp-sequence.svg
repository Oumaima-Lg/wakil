<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2060" viewBox="0 0 840 1030" role="img" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title>Communication entre l'agent Wakil, le LLM, le serveur de la FAQ (RAG) et le serveur de la banque</title>
  <desc>Au démarrage, agent-api demande la liste des outils aux deux serveurs MCP : rag-faq annonce question_faq, mcp-tools annonce les 5 outils de la banque. Pour une question générale, le LLM choisit question_faq ; agent-api envoie la phrase du client à rag-faq, qui calcule son vecteur avec bge-m3 et cherche dans pgvector, puis renvoie la fiche ; agent-api la cite telle quelle. Pour un paiement, le LLM choisit payer_facture ; agent-api appelle mcp-tools sans confirmation (vérification à blanc), puis après le Oui du client avec la confirmation ; mcp-tools appelle bank-api.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="840" height="1030" fill="#FFFFFF"/>

  <rect x="35" y="20" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
  <text x="100" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">LLM</text>
  <text x="100" y="62" text-anchor="middle" font-size="12" fill="#854F0B">qwen3 · Ollama</text>
  <rect x="195" y="20" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="260" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">agent-api</text>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#534AB7">LangGraph</text>
  <rect x="355" y="20" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="420" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">rag-faq</text>
  <text x="420" y="62" text-anchor="middle" font-size="12" fill="#993C1D">serveur MCP · RAG</text>
  <rect x="515" y="20" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="580" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">mcp-tools</text>
  <text x="580" y="62" text-anchor="middle" font-size="12" fill="#534AB7">serveur MCP</text>
  <rect x="675" y="20" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="740" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">bank-api</text>
  <text x="740" y="62" text-anchor="middle" font-size="12" fill="#0F6E56">règles métier</text>

  <g stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4">
    <path d="M100 76V92M100 116V274M100 298V532M100 556V788M100 812V974"/>
    <path d="M260 76V92M260 116V274M260 298V492M260 516V532M260 556V788M260 812V974"/>
    <path d="M420 76V92M420 116V274M420 298V418M420 442V532M420 556V788M420 812V974"/>
    <path d="M580 76V92M580 116V274M580 298V532M580 556V788M580 812V974"/>
    <path d="M740 76V92M740 116V274M740 298V532M740 556V788M740 812V974"/>
  </g>

  <g fill="#F1EFE8" stroke="#888780" stroke-width="0.75">
    <rect x="35" y="92" width="770" height="24" rx="4"/>
    <rect x="35" y="274" width="770" height="24" rx="4"/>
    <rect x="35" y="532" width="770" height="24" rx="4"/>
    <rect x="35" y="788" width="770" height="24" rx="4"/>
  </g>
  <g font-size="12" fill="#444441">
    <text x="47" y="108">Au démarrage d'agent-api : chaque serveur MCP annonce ses outils (la FAQ est déjà indexée)</text>
    <text x="47" y="290">Le client demande « wach kayn chi frais 3la l virement ? »</text>
    <text x="47" y="548">Le client écrit « khelless liya l'eau »</text>
    <text x="47" y="804">Carte « Wach nconfirmi ? », le client répond « Oui »</text>
  </g>

  <rect x="330" y="418" width="180" height="24" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <rect x="175" y="492" width="170" height="24" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <g font-size="11" text-anchor="middle">
    <text x="420" y="434" fill="#712B13">bge-m3 → vecteur → pgvector</text>
    <text x="260" y="508" fill="#3C3489">fiche citée telle quelle</text>
  </g>

  <g fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#fleche)">
    <line x1="264" y1="150" x2="416" y2="150"/>
    <line x1="264" y1="222" x2="576" y2="222"/>
    <line x1="256" y1="332" x2="104" y2="332"/>
    <line x1="264" y1="404" x2="416" y2="404"/>
    <line x1="256" y1="590" x2="104" y2="590"/>
    <line x1="264" y1="662" x2="576" y2="662"/>
    <line x1="584" y1="698" x2="736" y2="698"/>
    <line x1="264" y1="846" x2="576" y2="846"/>
    <line x1="584" y1="882" x2="736" y2="882"/>
  </g>
  <g fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fleche)">
    <line x1="416" y1="186" x2="264" y2="186"/>
    <line x1="576" y1="258" x2="264" y2="258"/>
    <line x1="104" y1="368" x2="256" y2="368"/>
    <line x1="416" y1="478" x2="264" y2="478"/>
    <line x1="104" y1="626" x2="256" y2="626"/>
    <line x1="736" y1="734" x2="584" y2="734"/>
    <line x1="576" y1="770" x2="264" y2="770"/>
    <line x1="736" y1="918" x2="584" y2="918"/>
    <line x1="576" y1="954" x2="264" y2="954"/>
  </g>
  <g font-size="12" fill="#444441" text-anchor="middle">
    <text x="340" y="140">tools/list</text>
    <text x="340" y="176">question_faq</text>
    <text x="500" y="212">tools/list</text>
    <text x="500" y="248">les 5 outils</text>
    <text x="180" y="322">demande + 6 outils</text>
    <text x="180" y="358">question_faq</text>
    <text x="340" y="394">question_faq(phrase)</text>
    <text x="340" y="468">« Frais et tarifs » (0,90)</text>
    <text x="180" y="580">demande + 6 outils</text>
    <text x="180" y="616">payer_facture(eau)</text>
    <text x="500" y="652">tools/call, sans oui</text>
    <text x="660" y="688">?simulation=true</text>
    <text x="660" y="724">vérifié, rien payé</text>
    <text x="500" y="760">aperçu : 312 DH</text>
    <text x="500" y="836">tools/call + « oui »</text>
    <text x="660" y="872">payer pour de vrai</text>
    <text x="660" y="908">payé : 2 038 DH</text>
    <text x="500" y="944">résultat → Tkhelssat</text>
  </g>

  <g font-size="11" fill="#5F5E5A">
    <line x1="35" y1="1000" x2="59" y2="1000" stroke="#888780" stroke-width="1.5"/>
    <text x="65" y="1004">demande</text>
    <line x1="135" y1="1000" x2="159" y2="1000" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="165" y="1004">réponse</text>
    <rect x="235" y="993" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
    <text x="255" y="1004">LLM : décide</text>
    <rect x="345" y="993" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
    <text x="365" y="1004">RAG de la FAQ : cherche</text>
  </g>
</svg>
