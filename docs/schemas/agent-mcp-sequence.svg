<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1360" viewBox="0 0 680 680" role="img" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title>Communication entre l'agent Wakil et le serveur MCP</title>
  <desc>Au démarrage, agent-api demande la liste des outils au serveur MCP (tools/list). À chaque message, le LLM choisit un outil ; agent-api l'appelle sans confirmation (vérification à blanc), puis, après le Oui du client, avec la confirmation ; le serveur MCP appelle bank-api.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="680" fill="#FFFFFF"/>

  <rect x="40" y="20" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="100" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">LLM</text>
  <text x="100" y="62" text-anchor="middle" font-size="12" fill="#5F5E5A">Ollama</text>
  <rect x="190" y="20" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="250" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">agent-api</text>
  <text x="250" y="62" text-anchor="middle" font-size="12" fill="#534AB7">LangGraph</text>
  <rect x="360" y="20" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="420" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">mcp-tools</text>
  <text x="420" y="62" text-anchor="middle" font-size="12" fill="#534AB7">serveur MCP</text>
  <rect x="520" y="20" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="580" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">bank-api</text>
  <text x="580" y="62" text-anchor="middle" font-size="12" fill="#0F6E56">règles métier</text>

  <g stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4">
    <path d="M100 76V92M250 76V92M420 76V92M580 76V92"/>
    <path d="M100 116V204M250 116V204M420 116V204M580 116V204"/>
    <path d="M100 228V460M250 228V460M420 228V460M580 228V460"/>
    <path d="M100 484V650M250 484V650M420 484V650M580 484V650"/>
  </g>

  <g fill="#F1EFE8" stroke="#888780" stroke-width="0.75">
    <rect x="40" y="92" width="600" height="24" rx="4"/>
    <rect x="40" y="204" width="600" height="24" rx="4"/>
    <rect x="40" y="460" width="600" height="24" rx="4"/>
  </g>
  <g font-size="12" fill="#444441">
    <text x="52" y="108">Au démarrage d'agent-api</text>
    <text x="52" y="220">Le client écrit « khelless liya l'eau »</text>
    <text x="52" y="476">Carte « Wach nconfirmi ? », le client répond « Oui »</text>
  </g>

  <g fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#fleche)">
    <line x1="254" y1="150" x2="416" y2="150"/>
    <line x1="246" y1="262" x2="104" y2="262"/>
    <line x1="254" y1="334" x2="416" y2="334"/>
    <line x1="424" y1="370" x2="576" y2="370"/>
    <line x1="254" y1="518" x2="416" y2="518"/>
    <line x1="424" y1="554" x2="576" y2="554"/>
  </g>
  <g fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fleche)">
    <line x1="416" y1="186" x2="254" y2="186"/>
    <line x1="104" y1="298" x2="246" y2="298"/>
    <line x1="576" y1="406" x2="424" y2="406"/>
    <line x1="416" y1="442" x2="254" y2="442"/>
    <line x1="576" y1="590" x2="424" y2="590"/>
    <line x1="416" y1="626" x2="254" y2="626"/>
  </g>
  <g font-size="12" fill="#444441" text-anchor="middle">
    <text x="335" y="140">tools/list</text>
    <text x="335" y="176">les 5 outils décrits</text>
    <text x="175" y="252">demande + outils</text>
    <text x="175" y="288">payer_facture(eau)</text>
    <text x="335" y="324">tools/call, sans oui</text>
    <text x="500" y="360">?simulation=true</text>
    <text x="500" y="396">vérifié, rien payé</text>
    <text x="335" y="432">aperçu : 312 DH</text>
    <text x="335" y="508">tools/call + « oui »</text>
    <text x="500" y="544">payer pour de vrai</text>
    <text x="500" y="580">payé : 2 038 DH</text>
    <text x="335" y="616">résultat → Tkhelssat</text>
  </g>

  <g font-size="11" fill="#5F5E5A">
    <line x1="40" y1="664" x2="64" y2="664" stroke="#888780" stroke-width="1.5"/>
    <text x="70" y="668">demande</text>
    <line x1="140" y1="664" x2="164" y2="664" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="170" y="668">réponse</text>
  </g>
</svg>
